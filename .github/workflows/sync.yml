name: daily-sync

on:
  # daily run is started at 11:30 UTC by the ph-resolve Worker's timer (GitHub's own schedule ran 5-9 hours late)
  workflow_dispatch:                
    inputs:
      task:
        description: "daily | route | enrich | producthunt | launches | revenue | funded | chrome | shopify | marketingdb | retag | push | selftest | verify | report | backfill"
        required: true
        default: daily
      limit:
        description: "max items for a single list run (blank = list default)"
        required: false
        default: ""
      args:
        description: "extra flags, e.g. --day 2026-10-08 --min-votes 50, or --apply for push"
        required: false
        default: ""

concurrency:
  group: ${{ github.event.inputs.task == 'backfill' && 'backfill' || 'daily-sync' }}              # never two runs writing at once
  cancel-in-progress: false

permissions:
  actions: write          # report.py counts this month's Actions minutes
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      APIFY_TOKENS: ${{ secrets.APIFY_TOKENS }}
      REOON_API_KEY: ${{ secrets.REOON_API_KEY }}
      PH_TOKEN: ${{ secrets.PH_TOKEN }}
      INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
      PH_RESOLVER_URL: ${{ secrets.PH_RESOLVER_URL }}
      PH_RESOLVER_SECRET: ${{ secrets.PH_RESOLVER_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GUMLOOP_API_KEY: ${{ secrets.GUMLOOP_API_KEY }}
      GUMLOOP_USER_ID: ${{ secrets.GUMLOOP_USER_ID }}
      GUMLOOP_AGENT_ID: ${{ secrets.GUMLOOP_AGENT_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OUTSCRAPER_API_KEY: ${{ secrets.OUTSCRAPER_API_KEY }}
      DATAFORSEO_AUTH_BASE64: ${{ secrets.DATAFORSEO_AUTH_BASE64 }}
      AZURE_CHAT_KEY: ${{ secrets.AZURE_CHAT_KEY }}
      PY: python
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: run
        id: run
        run: |
          set -o pipefail
          T="${{ github.event.inputs.task || 'daily' }}"
          L="${{ github.event.inputs.limit }}"
          A="${{ github.event.inputs.args }}"
          case "$T" in
            daily) bash daily.sh; cat cache/daily-*.log ;;
            push)  python push_lists.py $A ;;
            route) python sync_outreach.py && python route_outreach.py $A ;;
            enrich) python enrich_companies.py $A ;;
            retag) python run.py retag ;;
            selftest) python run.py selftest ;;
            verify) python verify.py $A ;;
            report) python report.py $A ;;
            yelp)  python yelp.py $A ;;
            backfill) python run.py backfill $A; python verify.py ;;
            *)     python run.py "$T" ${L:+--limit "$L"} $A ;;
          esac
      - name: hand the rest of a backfill to a fresh job
        if: github.event.inputs.task == 'backfill' && steps.run.outputs.next_from != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          A="${{ github.event.inputs.args }}"
          NEXT=$(echo "$A" | sed -E "s/--from [0-9-]+/--from ${{ steps.run.outputs.next_from }}/")
          gh workflow run sync.yml -R "$GITHUB_REPOSITORY" -f task=backfill -f args="$NEXT"
